<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>My files</title>
<style>
:root{--bg:#eef1f2;--card:#fff;--ink:#17262b;--mute:#5d7077;--line:#d3dcdf;--acc:#1d6b87;--on:#fff;--bad:#b3402f}
@media(prefers-color-scheme:dark){:root{--bg:#0f181b;--card:#172428;--ink:#e6eef0;--mute:#93a6ac;--line:#293a3f;--acc:#5bb3d0;--on:#08181d;--bad:#ee8a79}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 72px}
h1{font-size:1.4rem;line-height:1.2;margin:0;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.auth{max-width:380px;margin:10vh auto 0;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:.875rem;color:var(--mute)}
input[type=text],input[type=email],input[type=password]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 16px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:600}
.btn:disabled{opacity:.6;cursor:default}
.link{font:inherit;background:none;border:0;color:var(--acc);cursor:pointer;padding:8px;min-height:36px}
.link.bad{color:var(--bad)}
.swap{margin:0;color:var(--mute);font-size:.9rem}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 16px}
.who{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:.9rem}
.up{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.up input[type=file]{flex:1;min-width:200px;font:inherit;color:var(--ink)}
ul.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:10px}
.list>li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.list>li.empty{display:block;padding:28px 16px;text-align:center;color:var(--mute)}
.txt{display:grid;flex:1;min-width:0}
.t{overflow-wrap:anywhere;font-weight:500}
.meta{color:var(--mute);font-size:.875rem}
.acts{display:flex;flex:none}
#toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,24px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:90vw;transition:.2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--bad);color:var(--on)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// Empty = same server that serves this page (recommended).
const API = "";

const $ = s => document.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k.includes("-")) n.setAttribute(k, v);
    else n[k] = v;
  }
  n.append(...kids.flat().filter(x => x != null && x !== false && x !== ""));
  return n;
};

let token = localStorage.getItem("token");
let me, files = [], listEl, tt;

function toast(m, bad) {
  const n = $("#toast");
  n.textContent = m;
  n.className = bad ? "bad show" : "show";
  clearTimeout(tt);
  tt = setTimeout(() => (n.className = ""), 4000);
}

async function api(path, { method = "GET", json, form, raw } = {}) {
  const headers = {};
  let body;
  if (token) headers.Authorization = "Bearer " + token;
  if (json !== undefined) { headers["Content-Type"] = "application/json"; body = JSON.stringify(json); }
  if (form) body = form;
  let res;
  try { res = await fetch(API + path, { method, headers, body }); }
  catch { throw new Error("Can’t reach the server. Check that the backend is running."); }
  if (!res.ok) {
    let msg = res.statusText || "Request failed";
    try {
      const d = (await res.json()).detail;
      msg = Array.isArray(d) ? d.map(e => e.loc.slice(1).join(".") + ": " + e.msg).join("; ") : d || msg;
    } catch {}
    if (res.status === 401 && token) { signOut(); msg = "Your session expired. Sign in again."; }
    throw new Error(msg);
  }
  if (raw) return res;
  return res.status === 204 ? null : res.json();
}

function signOut() {
  token = me = null;
  localStorage.removeItem("token");
  renderAuth();
}

const field = (name, label, type, ac) =>
  el("label", {}, label, el("input", { type, name, required: true, autocomplete: ac || "off" }));

function renderAuth(mode = "login") {
  const reg = mode === "register";
  const f = el("form", {
    class: "card auth",
    onsubmit: async e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(f));
      try {
        if (reg) await api("/user/register", { method: "POST", json: d });
        token = await api("/user/login", { method: "POST", json: { username: d.username, password: d.password } });
        localStorage.setItem("token", token);
        await start();
      } catch (err) { toast(err.message, true); }
    }
  },
    el("h1", {}, reg ? "Create your account" : "Sign in"),
    reg && field("name", "Name", "text", "name"),
    field("username", "Username", "text", "username"),
    reg && field("email", "Email", "email", "email"),
    field("password", "Password", "password", reg ? "new-password" : "current-password"),
    el("button", { class: "btn primary", type: "submit" }, reg ? "Create account" : "Sign in"),
    el("p", { class: "swap" }, reg ? "Already registered? " : "New here? ",
      el("button", { type: "button", class: "link", onclick: () => renderAuth(reg ? "login" : "register") },
        reg ? "Sign in" : "Create an account"))
  );
  $("#app").replaceChildren(f);
}

const fmtSize = n => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB";
const fmtDate = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }); };

function paintFiles() {
  listEl.replaceChildren(...(files.length
    ? files.slice().sort((a, b) => b.id - a.id).map(f => el("li", {},
        el("div", { class: "txt" }, el("span", { class: "t" }, f.filename), el("span", { class: "meta" }, fmtSize(f.size) + ", " + fmtDate(f.created_at))),
        el("div", { class: "acts" },
          el("button", { class: "link", onclick: () => dl(f) }, "Download"),
          el("button", { class: "link bad", onclick: () => del(f) }, "Delete"))))
    : [el("li", { class: "empty" }, "No files yet. Choose one above to upload it.")]));
}

async function loadFiles() { files = (await api("/files/")).data; }

async function dl(f) {
  try {
    const blob = await (await api("/files/download/" + f.id, { raw: true })).blob();
    const url = URL.createObjectURL(blob);
    const a = el("a", { href: url, download: f.filename });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { toast(e.message, true); }
}

async function del(f) {
  if (!confirm("Delete “" + f.filename + "”?")) return;
  try { await api("/files/" + f.id, { method: "DELETE" }); files = files.filter(x => x.id !== f.id); paintFiles(); }
  catch (e) { toast(e.message, true); }
}

function renderApp() {
  const inp = el("input", { type: "file", "aria-label": "Choose a file" });
  const btn = el("button", { class: "btn primary", type: "submit" }, "Upload");
  const form = el("form", {
    class: "up",
    onsubmit: async e => {
      e.preventDefault();
      const f = inp.files[0];
      if (!f) return toast("Choose a file first.", true);
      if (f.size > 20 * 1048576) return toast("Files can be up to 20 MB.", true);
      btn.disabled = true; btn.textContent = "Uploading…";
      try {
        const fd = new FormData(); fd.append("file", f);
        await api("/files/upload", { method: "POST", form: fd });
        form.reset(); await loadFiles(); paintFiles(); toast("Uploaded “" + f.name + "”.");
      } catch (err) { toast(err.message, true); }
      btn.disabled = false; btn.textContent = "Upload";
    }
  }, inp, btn);
  listEl = el("ul", { class: "list" });
  paintFiles();
  $("#app").replaceChildren(
    el("header", { class: "top" }, el("h1", {}, "My files"),
      el("div", { class: "who" }, el("span", {}, me.name || me.username), el("button", { class: "btn", onclick: signOut }, "Sign out"))),
    form, listEl);
}

async function start() {
  if (!token) return renderAuth();
  try {
    me = await api("/user/auth");
    await loadFiles();
  } catch (e) {
    toast(e.message, true);
    if (!me) return renderAuth();
  }
  renderApp();
}

start();
</script>
</body>
</html>
